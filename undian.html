<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>ATM Undian Kelompok</title>
<style>
:root{--bg:#f6e7c1;--ink:#14213d;--card:#fffaf0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b2438;--ink:#f2ead3;--card:#26314a}}
:root[data-theme="dark"]{--bg:#1b2438;--ink:#f2ead3;--card:#26314a}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{min-height:100%;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif;overflow-x:hidden}
.page{max-width:600px;margin:0 auto;padding:8px 10px;text-align:center;height:100vh;height:100dvh;display:flex;flex-direction:column;align-items:center;overflow:hidden}.page>*{flex:none}.how{width:100%}
select{width:auto;max-width:220px;padding:3px 8px;font-size:12px;border-radius:8px;border:2px solid #14213d;background:var(--card);color:var(--ink);font-family:inherit;opacity:.85}
#vp{flex:1 1 0;min-height:0;width:100%;margin-top:4px;position:relative;overflow:hidden}
#stage{position:absolute;left:0;top:0;width:1024px;height:1620px;transform-origin:0 0}
#m{position:absolute;left:0;top:120px;width:1024px;height:1536px}
#m img,#m div{position:absolute}
#m img{display:block}
#scr{left:233px;top:248px;width:439px;height:310px;background:#0b57a4;color:#fff;border-radius:6px;overflow:hidden;display:flex;flex-direction:column}
#scr div{position:static}
.hd{height:44px;background:#fff;color:#0b2a5c;font-weight:700;font-size:26px;letter-spacing:3px;overflow:hidden;white-space:nowrap;display:flex;align-items:center}.hd span{display:inline-block;padding-left:100%;animation:run 9s linear infinite}@keyframes run{to{transform:translateX(-100%)}}.nm{height:34px;background:#083f78;color:#ffe14d;font-weight:700;font-size:21px;display:flex;align-items:center;justify-content:center;white-space:nowrap;overflow:hidden}
.bd{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:6px 14px;text-align:center}
.t1{font-size:30px;font-weight:700;line-height:1.15}.t2{font-size:22px;line-height:1.2}
.pin{display:flex;gap:9px}.pin b{width:40px;height:46px;border:3px solid #fff;border-radius:4px;font-size:38px;line-height:52px;color:#ffe14d}
.bar{width:360px;height:22px;border:3px solid #fff;border-radius:4px;padding:2px}.bar i{display:block;height:100%;width:0;background:#ffd23f}
.num{font-size:96px;font-weight:700;line-height:1;color:#ffe14d}
.pop{animation:pop .45s}
@keyframes pop{0%{transform:scale(.3)}70%{transform:scale(1.25)}100%{transform:scale(1)}}
.k{touch-action:manipulation;background:transparent;border-radius:10px;cursor:pointer;display:grid;place-items:center;font:700 30px Arial,sans-serif;color:#14213d;-webkit-tap-highlight-color:transparent;user-select:none}
.k:active{background:rgba(10,30,70,.28)}
#bills{overflow:hidden}
.bill{position:absolute;width:380px;animation:out .5s ease-out both}
@keyframes out{from{transform:translateY(-190px) rotate(var(--r))}to{transform:translateY(0) rotate(var(--r))}}
#sc{opacity:0;pointer-events:none}
#sc.on{opacity:1;animation:slam .3s cubic-bezier(.5,0,.8,1.5)}
@keyframes slam{from{transform:translateY(-90px);opacity:0}to{transform:none;opacity:1}}
#siren{opacity:0}#siren.on{animation:sir .25s infinite alternate}
@keyframes sir{from{opacity:.25;filter:brightness(.7)}to{opacity:1;filter:brightness(1.3)}}
.shake{animation:shake .25s}.crazy{animation:crazy .16s infinite}
@keyframes shake{25%{transform:translate(-14px,5px)}75%{transform:translate(14px,-5px)}}
@keyframes crazy{0%{transform:translate(-16px,6px) rotate(-.6deg)}50%{transform:translate(16px,-8px) rotate(.6deg)}100%{transform:translate(-10px,8px) rotate(-.4deg)}}
#fx{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
.p{position:absolute;top:-60px;background:center/contain no-repeat;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(115vh) rotate(720deg)}}
.btn{position:absolute;left:50%;bottom:6px;transform:translateX(-50%);z-index:5;padding:12px 22px;font-size:16px;font-weight:700;border-radius:12px;border:3px solid #14213d;background:#ffd23f;color:#14213d;font-family:inherit;display:none}
.how{max-width:420px;margin:16px auto 4px;padding:9px 10px 6px;border:2px solid #14213d;border-radius:10px;background:var(--card);box-shadow:0 3px 0 #14213d;font-size:11px;line-height:1.3;text-align:center}.ht{display:block;width:fit-content;margin:-20px auto 3px;padding:1px 12px;background:#e63946;color:#fff;border:2px solid #14213d;border-radius:999px;font-weight:900;font-size:11px;letter-spacing:1px;text-transform:uppercase}.how strong{color:#e63946;font-weight:800}
</style>
</head>
<body>
<div id="fx"></div>
<div class="page">
  <div class="how"><div class="ht">Cara bermain</div>Di mesin ATM, masukkan <strong>PIN</strong> Anda. Nomor kelompok Anda ditentukan oleh berapa <strong>lembar uang</strong> yang keluar dari mesin. Hasilnya <strong>acak</strong> berdasarkan nomor PIN yang Anda masukkan.</div>
  <div id="vp"><div id="stage"><div id="m"></div></div><button class="btn" id="next">Lihat kelompok saya</button></div>
</div>

const $=id=>document.getElementById(id);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
let ctx,cur={nama:"",kelompok:1},pin="",busy=true;
const SLOT_TOP=1052,KL=362,KT=650,KS=.298;

// ===== Suara =====
function snd(){if(!ctx){try{ctx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(ctx&&ctx.state==="suspended")ctx.resume()}
function tone(f,d=.1,type="square",v=.07,t0=0,to){if(!ctx)return;const t=ctx.currentTime+t0,o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(to)o.frequency.exponentialRampToValueAtTime(to,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+d+.02)}
const S={key:()=>tone(900,.06),
 bill:()=>{tone(200,.12,"sawtooth",.07,0,90);tone(1300,.04,"square",.04,.02)},
 tick:f=>tone(f,.06,"triangle",.12),
 lock:()=>{tone(110,.3,"square",.18,0,40);tone(1800,.05,"square",.1,.06);tone(700,.05,"square",.1,.14)},
 sad:()=>{[[311,0],[293,.45],[277,.9]].forEach(([f,t])=>tone(f,.42,"sawtooth",.09,t,f*.95));tone(233,1,"sawtooth",.1,1.35,190)},
 fan:()=>[523,659,784,1047].forEach((f,i)=>tone(f,.18,"square",.07,i*.12)),
 big:()=>[523,659,784,1047,784,1047,1319].forEach((f,i)=>tone(f,.16,"square",.08,i*.1)),
 siren:()=>{for(let i=0;i<8;i++)tone(i%2?700:950,.22,"sawtooth",.07,i*.22)}};

const m=$("m");
function el(t,css,attrs){const e=document.createElement(t);if(css)e.style.cssText=css;Object.assign(e,attrs||{});m.appendChild(e);return e}
el("img","left:0;top:0;width:1024px;height:1536px",{src:IMG.body});
el("div","left:240px;top:670px;width:545px;height:252px;background:#5f7b9d");
el("div","left:215px;top:1000px;width:595px;height:228px;background:#5f7b9d");

el("img","left:"+KL+"px;top:"+KT+"px;width:300px",{src:IMG.keypad});
const cx=[186,397,608,820],cy=[212,420,628,836];
const LAYOUT=[["1","2","3","R"],["4","5","6","Y"],["7","8","9","G"],["","0","",null]];
LAYOUT.forEach((row,r)=>row.forEach((k,c)=>{if(k===null)return;
  const b=el("div","left:"+(KL+cx[c]*KS-32)+"px;top:"+(KT+cy[r]*KS-32)+"px;width:64px;height:64px",{className:"k"});
  if(/\d/.test(k))b.textContent=k;else{b.textContent={R:"BATAL",Y:"HAPUS",G:"ENTER"}[k]||"";b.style.fontSize="11px";b.style.letterSpacing="0";b.style.whiteSpace="nowrap";if(k==="R")b.style.color="#fff"}b.onpointerdown=e=>{e.preventDefault();press(k)}}));
el("img","left:192px;top:"+SLOT_TOP+"px;width:640px",{src:IMG.slot_open});
const bills=el("div","left:0;top:"+(SLOT_TOP+40)+"px;width:1024px;height:520px",{id:"bills"});
el("img","left:192px;top:"+SLOT_TOP+"px;width:640px",{src:IMG.slot_closed,id:"sc"});
el("img","left:427px;top:-20px;width:170px",{src:IMG.fx_siren,id:"siren"});

st.textContent=["drop","spark","c1","c2","c3","smoke","bolt"].map(k=>`.p-${k}{background-image:url(${IMG["fx_"+k]})}`).join("");

function fit(){const vp=$("vp"),W=vp.clientWidth,H=vp.clientHeight,s=Math.min(W/780,H/1450),st=$("stage");st.style.transform="scale("+s+")";st.style.left=((W-780*s)/2-120*s)+"px";st.style.top=((H-1450*s)/2-100*s)+"px"}
addEventListener("resize",fit);fit();setTimeout(fit,400);

// ===== Layar =====
const view=h=>{$("bd").innerHTML=h};const setName=()=>{$("nm").textContent="PESERTA: "+cur.nama.toUpperCase()};
function idle(){
  const d=[...Array(6)].map((_,i)=>"<b>"+(i<pin.length?"*":"")+"</b>").join("");
  setName();view('<div class="t1">Selamat datang</div><div class="t2">Masukkan PIN Anda (6 digit)</div><div class="pin">'+d+'</div>');
}
function press(k){
  if(busy)return;snd();
  if(k==="R"){pin="";S.key();idle();return}
  if(k==="Y"){pin=pin.slice(0,-1);S.key();idle();return}
  if(k==="G"){if(pin.length===6)start();else tone(200,.2,"square",.08);return}
  if(/\d/.test(k)&&pin.length<6){pin+=k;S.key();idle();if(pin.length===6)setTimeout(()=>{if(!busy&&pin.length===6)start()},500)}
}
document.addEventListener("keydown",e=>{if(/^\d$/.test(e.key))press(e.key);else if(e.key==="Backspace")press("Y");else if(e.key==="Enter")press("G")});

// ===== Efek =====
function rain(kinds,n){const fx=$("fx");for(let i=0;i<n;i++){const e=document.createElement("div"),w=18+Math.random()*26;e.className="p p-"+kinds[Math.floor(Math.random()*kinds.length)];e.style.cssText+=`left:${Math.random()*100}vw;width:${w}px;height:${w*1.1}px;animation-duration:${2+Math.random()*2.5}s;animation-delay:${Math.random()*.8}s`;fx.appendChild(e);setTimeout(()=>e.remove(),5600)}}
function shake(){m.classList.remove("shake");void m.offsetWidth;m.classList.add("shake")}

// ===== Proses =====
const PROC=["Memeriksa PIN...","Membangunkan mesin ATM...","Meniup debu dari uang...","Bertanya ke tuyul...","Menghitung lembar uang..."];
async function start(){
  busy=true;
  const n=cur.kelompok,total=3200;let t=0;
  while(t<total){
    const msg=PROC[Math.min(PROC.length-1,Math.floor(t/total*PROC.length))];
    view('<div class="t1">Mohon tunggu</div><div class="t2">'+msg+'</div><div class="num">'+(1+Math.floor(Math.random()*48))+'</div><div class="bar"><i style="width:'+(t/total*100)+'%"></i></div>');
    m.style.transform="rotate("+((Math.random()-.5)*1)+"deg)";
    S.tick(300+Math.random()*500);await sleep(110);t+=110;
  }
  m.style.transform="";
  await dispense(n);
}

// ===== Uang keluar =====
async function dispense(n){
  const tier=n<=3?1:n<=10?2:n<=20?3:4;
  const slow=[600,950,1500],base=n<=10?450:n<=20?260:140;
  const step=n<=10?14:Math.max(3,Math.floor(130/n));
  for(let i=1;i<=n;i++){
    const fromEnd=n-i;let d=base;
    if(fromEnd<3)d=slow[2-fromEnd];
    if(n<=3)d=slow[i-1+(3-n)];
    view('<div class="t1">Silakan ambil uang Anda</div><div class="t2">Lembar ke-</div><div class="num pop">'+i+'</div>');
    if(fromEnd<3)S.tick(300+fromEnd*0);
    await sleep(d);
    const b=document.createElement("img");b.src=IMG.bill;b.className="bill";
    b.style.cssText=`left:${322+(Math.random()*16-8)}px;top:${10+step*(i-1)}px;z-index:${500-i};--r:${(Math.random()*3-1.5)}deg`;
    bills.appendChild(b);S.bill();
    if(tier>=3&&i%3===0)shake();
  }
  await sleep(400);
  $("sc").classList.add("on");await sleep(160);S.lock();shake();
  await sleep(500);finish(n,tier);
}
const TXT={
 1:["Cuma segini? ATM-nya lagi diet ketat.","Waduh, mesinnya pelit hari ini!","Hemat itu pangkal kaya, katanya."],
 2:["Lumayan lah, lumayan!","Mesin ATM-nya lagi baik hati!","Ada uangnya, ada rezekinya!"],
 3:["MERIAH! Uangnya melimpah ruah!","Mesinnya joget saking senangnya!","Wah, hari yang cerah buat dompet!"],
 4:["HEBOH! ATM-nya meledak bahagia!","BANJIR UANG! Siapkan karung!","SULTAN LEWAT! Minggir semua!"]};
function finish(n,tier){
  view('<div class="t2">KELOMPOK</div><div class="num pop">'+n+'</div><div class="t2">'+TXT[tier][Math.floor(Math.random()*3)]+'</div>');
  if(tier===1){S.sad();rain(["drop","smoke"],12)}
  else if(tier===2){S.fan();rain(["c1","c2","c3","spark"],35)}
  else if(tier===3){S.big();rain(["c1","c2","c3","spark"],80);shake()}
  else{S.big();S.siren();rain(["c1","c2","c3","spark","bolt"],160);
    m.classList.add("crazy");$("siren").classList.add("on");
    setTimeout(()=>{m.classList.remove("crazy");$("siren").classList.remove("on")},3000)}
  try{parent.postMessage({t:"done",g:n},location.origin)}catch(e){}
  $("next").style.display="inline-block";
}
$("next").onclick=()=>{snd();try{parent.postMessage({t:"close"},location.origin)}catch(e){}};
view('<div class="t1">Memuat...</div>');
addEventListener("message",e=>{const d=e.data||{};if(e.origin!==location.origin)return;if(d.t==="init"){cur={nama:String(d.nama||""),kelompok:Math.max(1,+d.g||1)};pin="";busy=false;idle()}});
try{parent.postMessage({t:"ready"},location.origin)}catch(e){}
</script>
